[package]
name = "nci"
version = "0.3.0"
edition = "2021"
authors = ["Brendan Dash <me@aiwan.run>"]
description = "Use the right package manager"
license = "MIT"
homepage = "https://github.com/Debbl/nci"
repository = "https://github.com/Debbl/nci.git"
keywords = ["cli", "npm", "pnpm", "yarn", "bun"]
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
console = "0.15.7"
dirs = "5.0.1"
rust-ini = "0.20.0"
lazy_static = "1.4.0"
parking_lot = "0.12.1"
serde = { version = "1.0.193", features = ["derive", "default"] }
serde_json = { version = "1.0.108", features = ["preserve_order"] }
tempfile = "3.8.1"
which = "5.0.0"
inquire = "0.6.2"
indexmap = { version = "2.1.0", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
termion = "4.0.2"
walkdir = "2.5"
serde_yaml_ng = "0.10"
nucleo-matcher = "0.3"

[[bin]]
name = "ni"
path = "src/bin/ni.rs"

[[bin]]
name = "nr"
path = "src/bin/nr.rs"


[[bin]]
name = "nci"
path = "src/bin/nci.rs"

[[bin]]
name = "na"
path = "src/bin/na.rs"

[[bin]]
name = "nlx"
path = "src/bin/nlx.rs"

[[bin]]
name = "nu"
path = "src/bin/nu.rs"

[[bin]]
name = "nup"
path = "src/bin/nup.rs"

[[bin]]
name = "nun"
path = "src/bin/nun.rs"

[[bin]]
name = "nd"
path = "src/bin/nd.rs"

# `cargo release <patch|minor|major> --execute` bumps the version, commits,
# tags as `vX.Y.Z`, and pushes — which then trips .github/workflows/release.yml.
# Install with: cargo install cargo-release
[package.metadata.release]
tag-prefix = "v"
tag-name = "v{{version}}"
tag-message = "v{{version}}"
pre-release-commit-message = "chore: release v{{version}}"
# Don't publish to crates.io. Releases live as GitHub Releases with prebuilt
# binaries; flip to `true` if you ever want crates.io distribution too.
publish = false
push = true
# Only allow releasing from `main`. Catches "oops I'm still on a feature
# branch" before it pushes a tag.
allow-branch = ["main"]
