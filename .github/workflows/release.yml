name: Release

# - Push a `v*` tag → create a GitHub Release + upload prebuilt binaries.
# - Manual dispatch  → build the binaries in dry-run mode so you can sanity-
#   check that all targets still compile without publishing anything.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    # Skipped on workflow_dispatch since there's no tag to release against.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # changelogithub walks the git history to diff against the previous
          # tag, so we need full history (default is shallow).
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      # Generates the Release body from Conventional Commits between this tag
      # and the previous one, then creates (or updates) the GitHub Release.
      - run: npx changelogithub@0.13
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    # Run even when `create-release` was skipped (dispatch path) so the
    # dispatch trigger still exercises every target via dry-run.
    if: |
      always() &&
      (needs.create-release.result == 'success' ||
       needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub retired the Intel macOS runners (macos-13) in late 2025.
          # We now cross-compile the x86_64 Darwin binary on an ARM runner —
          # Apple's toolchain handles this natively, no extra setup needed
          # beyond `rustup target add`, which the upload action does for us.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          # All nine binaries get bundled into one archive per target,
          # e.g. nci-x86_64-apple-darwin.tar.gz.
          bin: ni,nr,nci,na,nlx,nu,nup,nun,nd
          # The default archive name is `$bin-$target`, but `$bin` is
          # undefined when bundling multiple binaries — the action errors out.
          # Hard-code the package name as the archive prefix instead.
          archive: nci-$target
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          checksum: sha256
          # Dispatch runs don't have a tag — build everything but skip the
          # release upload. Lets you verify compilation across all targets.
          dry-run: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          token: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    # Only on tag pushes; dispatch runs don't have archives uploaded.
    needs: upload-assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Updates Formula/nci.rb in Debbl/homebrew-tap: bumps `version`, swaps in
      # the new release's per-target URLs, and recomputes each sha256 by
      # downloading the archives the formula references. One invocation covers
      # all three platforms because the action rewrites every matching url.
      - uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: nci
          formula-path: Formula/nci.rb
          homebrew-tap: Debbl/homebrew-tap
          # Any one of the per-target archives works as the version anchor —
          # the action discovers the tag/version from this URL and applies it
          # to every other url in the formula.
          download-url: https://github.com/Debbl/nci/releases/download/${{ github.ref_name }}/nci-aarch64-apple-darwin.tar.gz
          commit-message: |
            nci ${{ github.ref_name }}

            Created by https://github.com/Debbl/nci/actions/runs/${{ github.run_id }}
        env:
          # PAT with `contents: write` on Debbl/homebrew-tap. The default
          # GITHUB_TOKEN can't write to another repo.
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
