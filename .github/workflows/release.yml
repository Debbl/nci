name: Release

# - Push a `v*` tag → create a GitHub Release + upload prebuilt binaries.
# - Manual dispatch  → build the binaries in dry-run mode so you can sanity-
#   check that all targets still compile without publishing anything.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    # Skipped on workflow_dispatch since there's no tag to release against.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # changelogithub walks the git history to diff against the previous
          # tag, so we need full history (default is shallow).
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      # Generates the Release body from Conventional Commits between this tag
      # and the previous one, then creates (or updates) the GitHub Release.
      - run: npx changelogithub@0.13
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    # Run even when `create-release` was skipped (dispatch path) so the
    # dispatch trigger still exercises every target via dry-run.
    if: |
      always() &&
      (needs.create-release.result == 'success' ||
       needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub retired the Intel macOS runners (macos-13) in late 2025.
          # We now cross-compile the x86_64 Darwin binary on an ARM runner —
          # Apple's toolchain handles this natively, no extra setup needed
          # beyond `rustup target add`, which the upload action does for us.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          # All nine binaries get bundled into one archive per target,
          # e.g. nci-x86_64-apple-darwin.tar.gz.
          bin: ni,nr,nci,na,nlx,nu,nup,nun,nd
          # The default archive name is `$bin-$target`, but `$bin` is
          # undefined when bundling multiple binaries — the action errors out.
          # Hard-code the package name as the archive prefix instead.
          archive: nci-$target
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          checksum: sha256
          # Dispatch runs don't have a tag — build everything but skip the
          # release upload. Lets you verify compilation across all targets.
          dry-run: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          token: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    # Only on tag pushes; dispatch runs don't have archives uploaded.
    needs: upload-assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Discovery-based bump: every `sha256 "..."` line in the formula carries
      # an `# <asset-filename>` marker (oven-sh/homebrew-bun's pattern). The
      # Python step walks each sha256 line, reads the marker, fetches the
      # matching `.sha256` sidecar from this release, and substitutes. No
      # hard-coded target list — adding a platform means adding one row to
      # the formula, this workflow doesn't change.
      - uses: actions/checkout@v5
        with:
          repository: Debbl/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Bump Formula/nci.rb and push to tap
        env:
          TAG: ${{ github.ref_name }}
          RUN_URL: https://github.com/Debbl/nci/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os, pathlib, re, urllib.request

          tag = os.environ["TAG"]
          version = tag.lstrip("v")
          repo = "Debbl/nci"
          path = pathlib.Path("tap/Formula/nci.rb")
          src = path.read_text()
          original = src

          # Bump the version field. Single-line replace; no anchoring needed.
          src = re.sub(r'version "[^"]+"', f'version "{version}"', src, count=1)

          def sidecar_url(asset: str) -> str:
              # nci-x86_64-apple-darwin.tar.gz → ...-darwin.sha256
              base = re.sub(r"\.(tar\.gz|tar\.xz|zip)$", "", asset)
              return f"https://github.com/{repo}/releases/download/{tag}/{base}.sha256"

          def fetch_sha(asset: str) -> str:
              with urllib.request.urlopen(sidecar_url(asset)) as r:
                  return r.read().decode().split()[0]

          # Match: sha256 "<old-hex>" # <asset-filename>
          # Groups: 1 = leading `sha256 "`, 2 = old hex, 3 = `" # `, 4 = asset
          line_re = re.compile(r'(sha256 ")([a-f0-9]+)(" # )(\S+)')

          markers = [m.group(4) for m in line_re.finditer(src)]
          if not markers:
              raise SystemExit(
                  "no `sha256 \"...\" # <asset>` markers found in formula — "
                  "did the formula lose its markers?"
              )
          print(f"found {len(markers)} marked sha256 line(s): {markers}")

          def replace_one(m: re.Match) -> str:
              asset = m.group(4)
              new = fetch_sha(asset)
              print(f"  {asset}: {m.group(2)} -> {new}")
              return f"{m.group(1)}{new}{m.group(3)}{asset}"

          src = line_re.sub(replace_one, src)

          if src == original:
              raise SystemExit(
                  "formula was not modified — sha256s and version already current?"
              )
          path.write_text(src)
          PY

          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/nci.rb
          git commit -m "nci ${TAG}

          Created by ${RUN_URL}"
          git push
