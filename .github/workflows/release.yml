name: Release

# - Push a `v*` tag → create a GitHub Release + upload prebuilt binaries.
# - Manual dispatch  → build the binaries in dry-run mode so you can sanity-
#   check that all targets still compile without publishing anything.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    # Skipped on workflow_dispatch since there's no tag to release against.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # changelogithub walks the git history to diff against the previous
          # tag, so we need full history (default is shallow).
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      # Generates the Release body from Conventional Commits between this tag
      # and the previous one, then creates (or updates) the GitHub Release.
      - run: npx changelogithub@0.13
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    # Run even when `create-release` was skipped (dispatch path) so the
    # dispatch trigger still exercises every target via dry-run.
    if: |
      always() &&
      (needs.create-release.result == 'success' ||
       needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub retired the Intel macOS runners (macos-13) in late 2025.
          # We now cross-compile the x86_64 Darwin binary on an ARM runner —
          # Apple's toolchain handles this natively, no extra setup needed
          # beyond `rustup target add`, which the upload action does for us.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          # All nine binaries get bundled into one archive per target,
          # e.g. nci-x86_64-apple-darwin.tar.gz.
          bin: ni,nr,nci,na,nlx,nu,nup,nun,nd
          # The default archive name is `$bin-$target`, but `$bin` is
          # undefined when bundling multiple binaries — the action errors out.
          # Hard-code the package name as the archive prefix instead.
          archive: nci-$target
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          checksum: sha256
          # Dispatch runs don't have a tag — build everything but skip the
          # release upload. Lets you verify compilation across all targets.
          dry-run: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          token: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    # Only on tag pushes; dispatch runs don't have archives uploaded.
    needs: upload-assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # We can't use mislav/bump-homebrew-formula-action here: it only
      # rewrites the sha256 for the single download-url you hand it, which
      # leaves the other two targets pointing at the previous release's
      # sha256 — broken brew install for everyone not on macOS arm64.
      #
      # Instead, check the tap out directly and patch all three sha256s in
      # one atomic commit.
      - uses: actions/checkout@v5
        with:
          repository: Debbl/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Bump Formula/nci.rb (version + all 3 sha256s) and push
        env:
          TAG: ${{ github.ref_name }}
          RUN_URL: https://github.com/Debbl/nci/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          export VERSION="${TAG#v}"

          # Fetch each target's sha256 sidecar (uploaded by taiki-e/upload-
          # rust-binary-action). Sidecars are "<hex>  nci-<target>.tar.gz".
          # Stash each sha as an env var keyed by the underscored target name.
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            sha=$(curl -fsSL "https://github.com/Debbl/nci/releases/download/${TAG}/nci-${target}.sha256" | awk '{print $1}')
            export "SHA_${target//-/_}=${sha}"
          done

          # Patch the formula. Python over sed because we want to update
          # sha256 only on the line immediately after each matching url, not
          # every sha256 in the file.
          python3 - <<'PY'
          import os, pathlib, re

          version = os.environ["VERSION"]
          path = pathlib.Path("tap/Formula/nci.rb")
          src = path.read_text()
          original = src

          src = re.sub(r'version "[^"]+"', f'version "{version}"', src, count=1)

          for target in ("aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"):
              sha = os.environ[f"SHA_{target.replace('-', '_')}"]
              pattern = re.compile(
                  rf'(nci-{re.escape(target)}\.tar\.gz"\s*\n\s*sha256 ")[a-f0-9]+(")',
                  re.MULTILINE,
              )
              src, n = pattern.subn(rf'\g<1>{sha}\g<2>', src)
              if n != 1:
                  raise SystemExit(f"expected 1 sha256 match for {target}, found {n}")

          if src == original:
              raise SystemExit("formula was not modified — bailing instead of pushing an empty commit")

          path.write_text(src)
          PY

          # Commit and push to the tap. Identity here is a bot; the PAT in
          # the checkout step already configured push auth.
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/nci.rb
          git commit -m "nci ${TAG}

          Created by ${RUN_URL}"
          git push
